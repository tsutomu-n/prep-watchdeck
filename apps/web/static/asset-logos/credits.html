<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ロゴ出典 · Prep Watchdeck</title>
    <style>
      :root { color-scheme: dark light; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #101315; color: #d9ddde; line-height: 1.7; }
      main { max-width: 44rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
      h1 { font-size: 1.5rem; margin: 1rem 0 .5rem; }
      h2 { font-size: 1.1rem; margin: 0; }
      p { margin: .6rem 0; }
      a { color: #96c1d0; text-underline-offset: .2em; }
      a:focus-visible { outline: 2px solid #96c1d0; outline-offset: 4px; }
      article { border-top: 1px solid #364047; margin-top: 1.5rem; padding-top: 1.5rem; }
      .identity { display: flex; align-items: center; gap: .75rem; }
      img { width: 32px; height: 32px; object-fit: contain; }
      small { color: #abb4b8; }
      nav { display: flex; flex-wrap: wrap; gap: 1rem; }
      nav a { display: inline-flex; align-items: center; min-height: 44px; }
      @media (prefers-color-scheme: light) {
        body { background: #f8fafb; color: #243139; }
        a { color: #22667f; }
        a:focus-visible { outline-color: #22667f; }
        article { border-color: #cbd4d8; }
        small { color: #54656e; }
      }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="Watchdeck">
        <a href="/?mode=native">取引所別一覧</a>
        <a href="/rankings">ランキング</a>
      </nav>
      <h1>ロゴ出典</h1>
      <p>確認できた原資産のロゴを掲載しています。画像はブランド色を保ち、未改変で配信しています。</p>
      <article>
        <div class="identity">
          <img src="/asset-logos/bitcoin-b0231779b54f.png" alt="" width="32" height="32" />
          <h2>Bitcoin · BTC</h2>
        </div>
        <p>Bitcoin icon by BitPay, Inc.</p>
        <p>
          <a href="https://github.com/bitpay/bitcoin-brand/tree/887f040f7c44660b84c4000f4a54897ba5518194">素材と出典</a>
          · <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0 1.0 Universal</a>
        </p>
        <small>変更なし。</small>
      </article>
      <article>
        <div class="identity">
          <img src="/asset-logos/monero-531faec93058.png" alt="" width="32" height="32" />
          <h2>Monero · XMR</h2>
        </div>
        <p>Monero Symbol by The Monero Project.</p>
        <p>
          <a href="https://www.getmonero.org/press-kit/">素材と出典</a>
          · <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>
          · <a href="https://www.getmonero.org/legal/#copyright">利用条件</a>
        </p>
        <small>変更なし。The Monero Projectによる本ツールの支持・推奨を示すものではありません。</small>
      </article>
    </main>
  </body>
</html>
