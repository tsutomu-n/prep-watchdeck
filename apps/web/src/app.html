<!doctype html>
<html lang="ja" data-layout="normal">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (() => {
        const defaultLayout = matchMedia("(max-width: 48rem)").matches ? "ultra" : "normal";
        document.documentElement.setAttribute("data-layout", defaultLayout);
        try {
          const current = localStorage.getItem("prep-watchdeck:workspace-preferences:v2");
          const value = JSON.parse(current ?? localStorage.getItem("prep-watchdeck:workspace-preferences:v1") ?? "{}");
          if (current === null && value && typeof value === "object") value.layout = defaultLayout;
          for (const [key, attribute, allowed] of [
            ["layout", "data-layout", ["normal", "ultra"]],
            ["textSize", "data-text-size", ["auto", "small", "standard", "large"]],
            ["rowSpacing", "data-row-spacing", ["auto", "compact", "standard", "comfortable"]]
          ]) if (value && allowed.includes(value[key])) document.documentElement.setAttribute(attribute, value[key]);
        } catch { /* Invalid or unavailable storage uses the device default. */ }
        const fallback = "watchdeck";
        const schemes = new Set([
          "watchdeck",
          "carbon-aurora",
          "forest-amber",
          "plum-signal",
          "paper-ledger",
          "arctic-terminal",
          "sage-field",
          "lilac-current"
        ]);
        let selected = fallback;
        try {
          const stored = localStorage.getItem("prep-watchdeck:color-scheme");
          if (schemes.has(stored)) selected = stored;
        } catch {
          selected = fallback;
        }
        document.documentElement.setAttribute("data-color-scheme", selected);

        const fontFallback = "watchdeck";
        const fontSchemes = new Set(["watchdeck", "terminal"]);
        let selectedFont = fontFallback;
        try {
          const storedFont = localStorage.getItem("prep-watchdeck:font-scheme");
          if (fontSchemes.has(storedFont)) selectedFont = storedFont;
        } catch {
          selectedFont = fontFallback;
        }
        document.documentElement.setAttribute("data-font-scheme", selectedFont);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
