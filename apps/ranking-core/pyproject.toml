[project]
name = "prep-watchdeck-ranking"
version = "0.1.0"
description = "Isolated public perpetual reference rankings for Prep Watchdeck"
requires-python = ">=3.13"
dependencies = ["aiohttp<3.13", "pydantic>=2.13.4"]

[project.scripts]
watchdeck-ranking = "prep_watchdeck_ranking.cli:main"

[dependency-groups]
dev = ["pyrefly>=1.0.0", "pytest>=9.1.0", "ruff>=0.15.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prep_watchdeck_ranking"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = ["src", "."]
