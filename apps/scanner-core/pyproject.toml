[project]
name = "prep-watchdeck-core"
version = "0.1.0"
description = "Local-first scanner core for prep-watchdeck"
requires-python = ">=3.13"
dependencies = [
    "aiohttp<3.13",
    "aiolimiter>=1.2.1",
    "duckdb>=1.5.4",
    "filelock>=3.29.4",
    "loguru>=0.7.3",
    "polars>=1.41.2",
    "pybotters<2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.1",
    "rich>=15.0.0",
    "typer>=0.26.7",
]

[project.scripts]
watchdeck = "prep_watchdeck.interfaces.cli:app"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that access real Bitget API",
]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "hypothesis>=6.150.0",
    "pyrefly>=1.0.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
    "time-machine>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/prep_watchdeck"]
