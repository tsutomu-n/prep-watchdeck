[project]
name = "prep-watchdeck-attention"
version = "0.1.0"
description = "Read-only market attention, prospective evidence and shadow allocation"
requires-python = ">=3.13"
dependencies = ["aiohttp<3.13", "pydantic>=2.13.4", "prep-watchdeck-market", "prep-watchdeck-ranking"]

[project.scripts]
watchdeck-attention = "prep_watchdeck_attention.cli:main"

[tool.uv.sources]
prep-watchdeck-market = { workspace = true }
prep-watchdeck-ranking = { workspace = true }

[dependency-groups]
dev = ["pyrefly>=1.0.0", "pytest>=9.1.0", "ruff>=0.15.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prep_watchdeck_attention"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = ["src", ".", "tests"]
