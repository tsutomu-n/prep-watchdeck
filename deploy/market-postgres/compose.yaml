name: prep-watchdeck-market

services:
  postgres:
    # Official Docker Hub postgres:17 OCI index, verified 2026-08-14.
    image: postgres:17@sha256:e42539a54ee3e82e21f19d7eded61b579869585f86b90b5e851ff0d3dd8b4001
    restart: "on-failure:5"
    env_file:
      - path: ${PREP_WATCHDECK_MARKET_ENV_FILE:?set the external Postgres env file}
        required: true
    ports:
      - "127.0.0.1:${PREP_WATCHDECK_MARKET_DB_PORT:-55432}:5432"
    volumes:
      - type: bind
        source: ${PREP_WATCHDECK_MARKET_STATE_DIR:?set the market state directory}/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    cpus: 2.0
    mem_limit: 4g
    shm_size: 512m
    stop_grace_period: 60s
