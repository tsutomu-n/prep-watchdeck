[project]
name = "prep-watchdeck"
version = "0.1.0"
description = "Local-first market prep watchdeck monorepo."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/scanner-core"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    "apps/web/.svelte-kit",
    "apps/web/node_modules",
    "data",
    "out",
    "var",
]
