---
name: Verify

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      core: ${{ steps.filter.outputs.core }}
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
      ops: ${{ steps.filter.outputs.ops }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check complete diff and detect changed surfaces
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            diff_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          elif [[ "$BASE_SHA" =~ ^0+$ ]]; then
            diff_base="$(git hash-object -t tree /dev/null)"
          else
            diff_base="$BASE_SHA"
          fi

          # Validate the complete proposed change, not only the last commit.
          git diff --check "$diff_base" "$HEAD_SHA" --

          if [[ "$EVENT_NAME" == "push" ]]; then
            printf '%s\n' 'docs=true' 'core=true' 'web=true' 'e2e=true' 'ops=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_paths="$(mktemp)"
          trap 'rm -f "$changed_paths"' EXIT
          git diff --name-only --no-renames -z "$diff_base" "$HEAD_SHA" -- > "$changed_paths"
          docs=false
          core=false
          web=false
          e2e=false
          ops=false

          while IFS= read -r -d '' path; do
            case "$path" in
              README.md|AGENTS.md|DESIGN.md|docs/*|apps/*/README.md|scripts/*/README.md|config/*/README.md)
                docs=true ;;
              scripts/maintenance/check-document-*|scripts/maintenance/document-*|scripts/maintenance/update-document-timestamp.mjs|scripts/maintenance/product-boundary.test.mjs)
                docs=true ;;
              .github/workflows/*|scripts/verify-local.sh)
                docs=true; core=true; web=true; e2e=true; ops=true ;;
              apps/market-core/*|pyproject.toml|uv.lock|.python-version)
                core=true ;;
              schemas/*)
                core=true; web=true; e2e=true ;;
              apps/web/*)
                web=true
                case "$path" in
                  apps/web/src/*.test.ts) ;;
                  apps/web/src/*|apps/web/static/*|apps/web/tests/e2e/*|apps/web/playwright.config.ts|apps/web/vite.config.ts|apps/web/svelte.config.js|apps/web/tsconfig.json|apps/web/package.json|apps/web/bun.lock)
                    e2e=true ;;
                esac
                ;;
              scripts/*|config/*|deploy/*)
                ops=true ;;
              .gitignore|.serena/*|.env.example|data/.gitkeep|out/.gitkeep|var/*/.gitkeep)
                ;;
              *)
                # Unclassified future code must not silently bypass verification.
                docs=true; core=true; web=true; e2e=true; ops=true ;;
            esac
          done < "$changed_paths"

          printf 'docs=%s\ncore=%s\nweb=%s\ne2e=%s\nops=%s\n' \
            "$docs" "$core" "$web" "$e2e" "$ops" >> "$GITHUB_OUTPUT"

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Document contracts
        run: |
          bun test \
            scripts/maintenance/document-contracts.test.mjs \
            scripts/maintenance/product-boundary.test.mjs
          bun scripts/maintenance/check-document-metadata.mjs
          bun scripts/maintenance/check-document-links.mjs

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17@sha256:e42539a54ee3e82e21f19d7eded61b579869585f86b90b5e851ff0d3dd8b4001
        env:
          POSTGRES_DB: prep_watchdeck_test
          POSTGRES_USER: prep_watchdeck_test
          POSTGRES_PASSWORD: watchdeck_test_only
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U prep_watchdeck_test -d prep_watchdeck_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://prep_watchdeck_test:watchdeck_test_only@127.0.0.1:55439/prep_watchdeck_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install market-core dependencies
        run: uv sync --package prep-watchdeck-market --group dev

      - name: Market Core gate
        run: |
          uv lock --check
          cd apps/market-core
          uv run python -m pytest -q
          uv run ruff check src tests
          uv run ruff format --check --diff src tests
          uv run pyrefly check

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Web unit and build gate
        working-directory: apps/web
        run: |
          bun run generate:types
          bun test
          bun run check
          bun run build

      - name: Install Playwright Chromium
        if: needs.changes.outputs.e2e == 'true'
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Desktop E2E
        if: needs.changes.outputs.e2e == 'true' && github.event_name == 'pull_request'
        working-directory: apps/web
        run: bun run test:e2e

      - name: Full desktop and mobile E2E
        if: needs.changes.outputs.e2e == 'true' && github.event_name == 'push'
        working-directory: apps/web
        env:
          PREP_WATCHDECK_FULL_E2E: "1"
        run: bun run test:e2e

  ops:
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Runtime and operations safety
        run: |
          bun test \
            scripts/maintenance/runtime-targets.test.mjs \
            scripts/ops/install-user-services.test.mjs \
            scripts/ops/market-postgres-restore.test.mjs

  verify:
    needs: [changes, docs, core, web, ops]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected gates to pass
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ needs.changes.result }}" == "success" ]]
          for gate in \
            "docs:${{ needs.changes.outputs.docs }}:${{ needs.docs.result }}" \
            "core:${{ needs.changes.outputs.core }}:${{ needs.core.result }}" \
            "web:${{ needs.changes.outputs.web }}:${{ needs.web.result }}" \
            "ops:${{ needs.changes.outputs.ops }}:${{ needs.ops.result }}"; do
            IFS=: read -r surface selected result <<<"$gate"
            case "$selected:$result" in
              true:success|false:skipped) ;;
              *) printf 'verification gate failed: %s selected=%s result=%s\n' "$surface" "$selected" "$result" >&2; exit 1 ;;
            esac
          done
